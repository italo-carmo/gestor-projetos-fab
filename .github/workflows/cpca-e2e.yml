name: CPCA E2E

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'e2e/**'
      - 'frontend/**'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.config.ts'
      - '.github/workflows/cpca-e2e.yml'
  push:
    branches: [ main ]
    paths:
      - 'e2e/**'
      - 'frontend/**'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.config.ts'
      - '.github/workflows/cpca-e2e.yml'

jobs:
  cpca-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Start frontend
        run: |
          npx -y node@20 ./frontend/node_modules/vite/bin/vite.js --config frontend/vite.config.ts --host 127.0.0.1 > /tmp/cpca-e2e-vite.log 2>&1 &
          echo $! > /tmp/cpca-e2e-vite.pid

      - name: Wait for frontend
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:5173 >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo 'Frontend did not start in time.'
          cat /tmp/cpca-e2e-vite.log || true
          exit 1

      - name: Run CPCA Playwright suite
        run: E2E_BASE_URL=http://127.0.0.1:5173 npm run e2e:cpca

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpca-playwright-report
          path: |
            playwright-report
            test-results
            /tmp/cpca-e2e-vite.log
          if-no-files-found: ignore
