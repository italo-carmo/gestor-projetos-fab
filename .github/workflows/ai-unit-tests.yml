name: AI Unit Tests

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/ai-unit-tests.yml'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/ai-unit-tests.yml'
      - 'package.json'
      - 'package-lock.json'

jobs:
  backend-ai-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm --prefix backend run prisma:generate

      - name: Build backend
        run: npm --prefix backend run build

      - name: Build frontend
        run: npm --prefix frontend run build

      - name: Run frontend unit tests
        run: npm --prefix frontend run test

      - name: Run backend unit tests
        run: npm --prefix backend run test:ci
